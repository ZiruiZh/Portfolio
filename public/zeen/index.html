  <body>
    <div id="root"></div>
  
    <script>
      // Four backdrops for the phone, remembered between visits.
      (() => {
        const options = [
          ['dither', 'Orange dither', 'linear-gradient(#ffffff99, #ffffff99), url(/zeen/assets/brand/bg-dither.webp) bottom center / cover'],
          ['dots', 'Dotted grey', 'radial-gradient(circle, #cfd4da 1.7px, transparent 2.2px) 0 0 / 9px 9px, #fff'],
          ['grey', 'Grey', '#e9e9e9'],
          ['peach', 'Pastel orange', '#ffe6d2'],
        ];
        const bar = document.createElement('div');
        bar.className = 'bg-switch';
        bar.setAttribute('role', 'group');
        bar.setAttribute('aria-label', 'Backdrop');
        const apply = name => {
          document.body.dataset.bg = name;
          try { localStorage.setItem('zeen-bg', name); } catch {}
          for (const button of bar.children) button.setAttribute('aria-pressed', String(button.dataset.bg === name));
        };
        for (const [name, label, swatch] of options) {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.bg = name;
          button.title = label;
          button.setAttribute('aria-label', label);
          button.style.background = swatch;
          button.addEventListener('click', () => apply(name));
          bar.append(button);
        }
        document.body.append(bar);
        let saved = null;
        try { saved = localStorage.getItem('zeen-bg'); } catch {}
        apply(options.some(option => option[0] === saved) ? saved : 'dither');
      })();

      // The way back to the case study.
      (() => {
        const back = document.createElement('a');
        back.className = 'zeen-back';
        back.href = '/#work/zeen';
        back.title = 'Back to the Zeen case study';
        back.setAttribute('aria-label', back.title);
        back.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>';
        document.body.append(back);
      })();
    </script>
  </body>
</html>
